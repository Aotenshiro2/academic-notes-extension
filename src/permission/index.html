<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autoriser le micro — Le Carnet du Trader</title>
  <style>
    /* Page utilitaire one-shot : Chrome n'affiche le prompt micro que dans un
       vrai onglet, jamais dans le side panel. Elle demande, confirme, se ferme. */
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d0f12;
      color: #e6e8eb;
    }
    .card {
      max-width: 420px;
      padding: 32px;
      border: 1px solid #2a2e35;
      border-radius: 16px;
      background: #14171c;
      text-align: center;
    }
    .mic { font-size: 40px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #9aa1ab; margin: 8px 0; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    code { background: #1f232a; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mic">🎙️</div>
    <h1>Autoriser le microphone</h1>
    <p id="status">Chrome va te demander l’accès au micro : clique sur « Autoriser ».</p>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
